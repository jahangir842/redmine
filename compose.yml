name: ${COMPOSE_PROJECT_NAME:-redmine}

services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDMINE_DB_DATABASE: ${REDMINE_DB_DATABASE:?set REDMINE_DB_DATABASE in .env}
      REDMINE_DB_USERNAME: ${REDMINE_DB_USERNAME:?set REDMINE_DB_USERNAME in .env}
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:?set REDMINE_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-redmine-db.sh:/docker-entrypoint-initdb.d/10-redmine-db.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$REDMINE_DB_PASSWORD\" psql --host=127.0.0.1 --username=\"$$REDMINE_DB_USERNAME\" --dbname=\"$$REDMINE_DB_DATABASE\" --tuples-only --command='SELECT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redmine:
    image: ${REDMINE_IMAGE:-local/redmine-dmsf:6.1.4-dmsf4.1.3}
    build:
      context: .
      dockerfile: docker/redmine/Dockerfile
      args:
        DMSF_VERSION: "4.1.3"
        DMSF_SHA256: "69f84f69945b1f7e5e7987dc996663052e08ace1f48a962e8e23ed69b3687425"
    restart: unless-stopped
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_PORT: "5432"
      REDMINE_DB_DATABASE: ${REDMINE_DB_DATABASE:?set REDMINE_DB_DATABASE in .env}
      REDMINE_DB_USERNAME: ${REDMINE_DB_USERNAME:?set REDMINE_DB_USERNAME in .env}
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD:?set REDMINE_DB_PASSWORD in .env}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?set REDMINE_SECRET_KEY_BASE in .env}
      REDMINE_NO_DB_MIGRATE: "1"
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
    volumes:
      - redmine_files:/usr/src/redmine/files
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  nginx:
    image: nginx:1.30.5-alpine3.24
    user: "101:101"
    restart: unless-stopped
    ports:
      - "${REDMINE_BIND_ADDRESS:-127.0.0.1}:${REDMINE_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      redmine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  redmine_files:

networks:
  frontend:
  backend:
    internal: true
